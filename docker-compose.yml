services:
  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db

  dealdesk:
    build: ./dealdesk
    ports:
      - "${DEALDESK_PORT:-4000}:4000"
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/dealdesk
      JWT_SECRET: docker-dev-jwt-secret
      BILLPORT_URL: http://billport:5000
      BILLPORT_SECRET: billport-shared-secret
      RECONCILE_STALE_MINUTES: 1
    depends_on:
      - mongo

  billport:
    build: ./billport
    ports:
      - "${BILLPORT_PORT:-5000}:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/billport
      BILLPORT_SECRET: billport-shared-secret
      DEALDESK_WEBHOOK_URL: http://dealdesk:4000/webhooks/billport
    depends_on:
      - mongo

volumes:
  mongo-data:
